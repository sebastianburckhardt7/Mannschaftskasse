<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mannschaftskasse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 10px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 { color: #1a237e; font-size: 24px; }
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav button {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border: none;
            background: #e0e0e0;
            color: #333;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        .nav button.active {
            background: #3949ab;
            color: white;
        }
        .nav button:active {
            transform: scale(0.95);
        }
        .content { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .page { display: none; }
        .page.active { display: block; }
        h2 { color: #1a237e; font-size: 18px; margin-bottom: 15px; margin-top: 0; }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3949ab;
            box-shadow: 0 0 0 3px rgba(57,73,171,0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #3949ab;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn:active {
            background: #283593;
            transform: scale(0.98);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .stat {
            background: linear-gradient(135deg, #3949ab, #5e35b1);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 11px; opacity: 0.9; margin-top: 5px; text-transform: uppercase; }
        .item {
            padding: 12px;
            background: #f5f5f5;
            border-left: 4px solid #3949ab;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .item-title { font-weight: 600; color: #1a237e; }
        .item-subtitle { font-size: 12px; color: #666; }
        .item-action {
            display: flex;
            gap: 8px;
        }
        .btn-small {
            padding: 8px 12px;
            border: none;
            background: #d32f2f;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-small:active {
            background: #c62828;
        }
        .alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .empty { color: #999; font-size: 13px; text-align: center; padding: 20px; }
        @media (max-width: 600px) {
            .nav button { font-size: 12px; padding: 10px; }
            .grid { grid-template-columns: 1fr; }
            .item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Mannschaftskasse</h1>
        </div>

        <div class="nav">
            <button onclick="showPage('dashboard')">Dashboard</button>
            <button onclick="showPage('mitglieder')">Mitglieder</button>
            <button onclick="showPage('strafen')">Strafen</button>
            <button onclick="showPage('zahlungen')">Zahlungen</button>
        </div>

        <div class="content">
            <!-- DASHBOARD -->
            <div id="dashboard" class="page active">
                <h2>Dashboard</h2>
                <div class="grid">
                    <div class="stat">
                        <div class="stat-value" id="stat-kassenstand">€0.00</div>
                        <div class="stat-label">Kassenstand</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-offen">€0.00</div>
                        <div class="stat-label">Offene Beträge</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-mitglieder">0</div>
                        <div class="stat-label">Mitglieder</div>
                    </div>
                </div>
                <h2 style="margin-top: 20px;">Offene Strafen</h2>
                <div id="dashboard-content"></div>
            </div>

            <!-- MITGLIEDER -->
            <div id="mitglieder" class="page">
                <h2>Mitglieder</h2>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="input-name" placeholder="Name eingeben">
                </div>
                <div class="form-group">
                    <label>Rolle</label>
                    <select id="input-rolle">
                        <option>Spieler</option>
                        <option>Trainer</option>
                        <option>Vorstand</option>
                    </select>
                </div>
                <button class="btn" onclick="addMitglied()">Mitglied hinzufügen</button>
                <h2 style="margin-top: 20px;">Alle Mitglieder</h2>
                <div id="mitglieder-list"></div>
            </div>

            <!-- STRAFEN -->
            <div id="strafen" class="page">
                <h2>Strafe eintragen</h2>
                <div class="form-group">
                    <label>Mitglied</label>
                    <select id="strafe-mitglied"></select>
                </div>
                <div class="form-group">
                    <label>Straftyp</label>
                    <select id="strafe-typ"></select>
                </div>
                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" id="strafe-datum">
                </div>
                <button class="btn" onclick="addStrafe()">Strafe eintragen</button>

                <h2 style="margin-top: 20px;">Strafenkatalog</h2>
                <div class="form-group">
                    <label>Neue Strafe</label>
                    <input type="text" id="katalog-name" placeholder="Name">
                </div>
                <div class="form-group">
                    <label>Betrag (€)</label>
                    <input type="number" id="katalog-betrag" placeholder="5.00" step="0.01">
                </div>
                <button class="btn" onclick="addKatalog()">Strafe hinzufügen</button>
                <div id="katalog-list" style="margin-top: 15px;"></div>
            </div>

            <!-- ZAHLUNGEN -->
            <div id="zahlungen" class="page">
                <h2>Zahlung erfassen</h2>
                <div class="form-group">
                    <label>Mitglied</label>
                    <select id="zahlung-mitglied"></select>
                </div>
                <div class="form-group">
                    <label>Betrag (€)</label>
                    <input type="number" id="zahlung-betrag" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" id="zahlung-datum">
                </div>
                <button class="btn" onclick="addZahlung()">Zahlung erfassen</button>
                <h2 style="margin-top: 20px;">Zahlungen</h2>
                <div id="zahlungen-list"></div>
            </div>
        </div>
    </div>

    <script>
        // APP STATE
        let app = {
            mitglieder: [
                { id: 1, name: 'Max Mustermann', rolle: 'Spieler' },
                { id: 2, name: 'Peter Schmitt', rolle: 'Spieler' }
            ],
            katalog: [
                { id: 1, name: 'Handy klingelt', betrag: 5.00 }
            ],
            strafen: [
                { id: 1, mitglied_id: 1, katalog_id: 1, datum: new Date().toISOString().split('T')[0], bezahlt: false }
            ],
            zahlungen: [],
            nextId: { mitglied: 3, katalog: 2, strafe: 2, zahlung: 1 }
        };

        // SAVE TO LOCALSTORAGE
        function save() {
            localStorage.setItem('mannschaftskasse', JSON.stringify(app));
        }

        // LOAD FROM LOCALSTORAGE
        function load() {
            const data = localStorage.getItem('mannschaftskasse');
            if (data) {
                app = JSON.parse(data);
            }
        }

        // SHOW TOAST
        function toast(msg) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // SWITCH PAGE
        function showPage(page) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(page).classList.add('active');
            event.target.classList.add('active');
            updateUI();
        }

        // MITGLIEDER
        function addMitglied() {
            const name = document.getElementById('input-name').value.trim();
            const rolle = document.getElementById('input-rolle').value;
            if (!name) { toast('Name erforderlich'); return; }
            
            app.mitglieder.push({ id: app.nextId.mitglied++, name, rolle });
            save();
            document.getElementById('input-name').value = '';
            toast('Mitglied hinzugefügt');
            updateUI();
        }

        function deleteMitglied(id) {
            if (confirm('Mitglied löschen?')) {
                app.mitglieder = app.mitglieder.filter(m => m.id !== id);
                save();
                toast('Mitglied gelöscht');
                updateUI();
            }
        }

        // KATALOG
        function addKatalog() {
            const name = document.getElementById('katalog-name').value.trim();
            const betrag = parseFloat(document.getElementById('katalog-betrag').value);
            if (!name || !betrag) { toast('Name und Betrag erforderlich'); return; }
            
            app.katalog.push({ id: app.nextId.katalog++, name, betrag });
            save();
            document.getElementById('katalog-name').value = '';
            document.getElementById('katalog-betrag').value = '';
            toast('Strafe hinzugefügt');
            updateUI();
        }

        function deleteKatalog(id) {
            if (confirm('Strafe löschen?')) {
                app.katalog = app.katalog.filter(k => k.id !== id);
                save();
                updateUI();
            }
        }

        // STRAFEN
        function addStrafe() {
            const mitglied_id = parseInt(document.getElementById('strafe-mitglied').value);
            const katalog_id = parseInt(document.getElementById('strafe-typ').value);
            const datum = document.getElementById('strafe-datum').value;
            
            if (!mitglied_id || !katalog_id || !datum) { toast('Alle Felder erforderlich'); return; }
            
            app.strafen.push({ id: app.nextId.strafe++, mitglied_id, katalog_id, datum, bezahlt: false });
            save();
            document.getElementById('strafe-mitglied').value = '';
            document.getElementById('strafe-typ').value = '';
            toast('Strafe eingetragen');
            updateUI();
        }

        function deleteStrafe(id) {
            if (confirm('Strafe löschen?')) {
                app.strafen = app.strafen.filter(s => s.id !== id);
                save();
                updateUI();
            }
        }

        // ZAHLUNGEN
        function addZahlung() {
            const mitglied_id = parseInt(document.getElementById('zahlung-mitglied').value);
            const betrag = parseFloat(document.getElementById('zahlung-betrag').value);
            const datum = document.getElementById('zahlung-datum').value;
            
            if (!mitglied_id || !betrag || !datum) { toast('Alle Felder erforderlich'); return; }
            
            app.zahlungen.push({ id: app.nextId.zahlung++, mitglied_id, betrag, datum });
            
            // Auto-mark as paid
            const mitgliedStrafen = app.strafen.filter(s => s.mitglied_id === mitglied_id && !s.bezahlt);
            let remaining = betrag;
            for (let strafe of mitgliedStrafen) {
                if (remaining <= 0) break;
                const katalogItem = app.katalog.find(k => k.id === strafe.katalog_id);
                if (remaining >= katalogItem.betrag) {
                    strafe.bezahlt = true;
                    remaining -= katalogItem.betrag;
                }
            }
            
            save();
            document.getElementById('zahlung-mitglied').value = '';
            document.getElementById('zahlung-betrag').value = '';
            toast('Zahlung erfasst');
            updateUI();
        }

        function deleteZahlung(id) {
            if (confirm('Zahlung löschen?')) {
                app.zahlungen = app.zahlungen.filter(z => z.id !== id);
                save();
                updateUI();
            }
        }

        // UPDATE UI
        function updateUI() {
            updateDashboard();
            updateMitglieder();
            updateKatalog();
            updateSelects();
            updateZahlungen();
        }

        function updateDashboard() {
            const zahlungen = app.zahlungen.reduce((sum, z) => sum + z.betrag, 0);
            const offeneStrafen = app.strafen.filter(s => !s.bezahlt);
            const offen = offeneStrafen.reduce((sum, s) => {
                const kat = app.katalog.find(k => k.id === s.katalog_id);
                return sum + (kat ? kat.betrag : 0);
            }, 0);
            
            document.getElementById('stat-kassenstand').textContent = '€' + (zahlungen - offen).toFixed(2);
            document.getElementById('stat-offen').textContent = '€' + offen.toFixed(2);
            document.getElementById('stat-mitglieder').textContent = app.mitglieder.length;
            
            let html = '';
            offeneStrafen.forEach(s => {
                const m = app.mitglieder.find(mi => mi.id === s.mitglied_id);
                const k = app.katalog.find(ki => ki.id === s.katalog_id);
                if (m && k) {
                    html += `<div class="item"><div><div class="item-title">${m.name}</div><div class="item-subtitle">${k.name} - ${s.datum}</div></div><div>€${k.betrag.toFixed(2)}</div></div>`;
                }
            });
            document.getElementById('dashboard-content').innerHTML = html || '<div class="empty">Keine offenen Strafen!</div>';
        }

        function updateMitglieder() {
            let html = '';
            app.mitglieder.forEach(m => {
                html += `<div class="item"><div><div class="item-title">${m.name}</div><div class="item-subtitle">${m.rolle}</div></div><div class="item-action"><button class="btn-small" onclick="deleteMitglied(${m.id})">Löschen</button></div></div>`;
            });
            document.getElementById('mitglieder-list').innerHTML = html || '<div class="empty">Keine Mitglieder</div>';
        }

        function updateKatalog() {
            let html = '';
            app.katalog.forEach(k => {
                const count = app.strafen.filter(s => s.katalog_id === k.id).length;
                html += `<div class="item"><div><div class="item-title">${k.name}</div><div class="item-subtitle">Vergeben: ${count}x</div></div><div style="display: flex; gap: 8px; align-items: center;"><span style="font-weight: bold;">€${k.betrag.toFixed(2)}</span><button class="btn-small" onclick="deleteKatalog(${k.id})">Löschen</button></div></div>`;
            });
            document.getElementById('katalog-list').innerHTML = html || '<div class="empty">Keine Strafen</div>';
        }

        function updateSelects() {
            let mHtml = '';
            app.mitglieder.forEach(m => {
                mHtml += `<option value="${m.id}">${m.name}</option>`;
            });
            document.getElementById('strafe-mitglied').innerHTML = mHtml;
            document.getElementById('zahlung-mitglied').innerHTML = mHtml;
            
            let kHtml = '';
            app.katalog.forEach(k => {
                kHtml += `<option value="${k.id}">${k.name} (€${k.betrag.toFixed(2)})</option>`;
            });
            document.getElementById('strafe-typ').innerHTML = kHtml;
        }

        function updateZahlungen() {
            let html = '';
            app.zahlungen.forEach(z => {
                const m = app.mitglieder.find(mi => mi.id === z.mitglied_id);
                html += `<div class="item"><div><div class="item-title">${m?.name}</div><div class="item-subtitle">${z.datum}</div></div><div style="display: flex; gap: 8px;"><span style="font-weight: bold; color: #00897b;">€${z.betrag.toFixed(2)}</span><button class="btn-small" onclick="deleteZahlung(${z.id})">Löschen</button></div></div>`;
            });
            document.getElementById('zahlungen-list').innerHTML = html || '<div class="empty">Keine Zahlungen</div>';
        }

        // INIT
        document.getElementById('strafe-datum').valueAsDate = new Date();
        document.getElementById('zahlung-datum').valueAsDate = new Date();
        load();
        updateUI();
    </script>
</body>
</html>
